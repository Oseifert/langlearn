<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>语卡 · Mandarin Flashcards</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css?v=104" />
</head>
<body>
  <header id="topbar">
    <button id="backBtn" class="icon-btn" hidden>‹</button>
    <h1 id="title">语卡</h1>
    <button id="autoplayBtn" class="icon-btn" hidden title="Auto-play sound"></button>
    <button id="settingsBtn" class="icon-btn" title="Backup &amp; settings">⚙</button>
    <button id="uploadBtn" class="icon-btn" title="Upload homework">＋</button>
  </header>

  <nav id="mainTabs" class="main-tabs" aria-label="App sections" hidden>
    <button class="btn ghost" type="button" data-view="home">Flashcards</button>
    <button class="btn ghost" type="button" data-view="movies">Movies</button>
    <button class="btn ghost" type="button" data-view="songs">Songs</button>
  </nav>
  <main id="view"></main>

  <input type="file" id="fileInput" accept=".json,.txt,.md,application/json,text/plain" hidden multiple />

  <div id="toast" class="toast" hidden></div>

  <script src="core.js?v=104"></script>
  <script src="sync.js?v=104"></script>
  <script src="movies.js?v=104"></script>
  <script src="app.js?v=104"></script>
</body>
</html>
